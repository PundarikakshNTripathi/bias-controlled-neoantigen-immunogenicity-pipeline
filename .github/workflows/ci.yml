name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify
        run: python scripts/verify.py

      - name: Integrity core must pass
        # Stated separately so a failure here is unmistakable in the run log:
        # these tests pin the claims the project exists to make.
        run: |
          python -m pytest -q \
            tests/test_bias_diagnostics.py \
            tests/test_gate.py \
            tests/test_splits.py \
            tests/test_metrics_and_policy.py

      - name: CLI smoke test
        run: |
          python -m nbx.cli doctor
          python -m nbx.cli status
